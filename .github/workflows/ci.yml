name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        identity: [locked, "0.10.0", "0.11.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm install --no-save agentic-identity@${{ matrix.identity }}
        if: matrix.identity != 'locked'
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
